<ion-header>
  <app-header [title]="'Revisión de Cartas'"></app-header>
</ion-header>

<ion-content *ngIf="cartaActual">
  <div class="revision-container">
    <ion-card class="swipe-card">
      <!-- Imagen grande -->
      <div class="imagen-principal-container">
        <img [src]="cartaActual.imagen_url_grande" alt="{{ cartaActual.nombre_espanol }}" class="imagen-principal">
        
        <!-- Imagen pequeña sobrepuesta -->
        <img *ngIf="cartaActual.imagen_url" [src]="cartaActual.imagen_url" alt="Miniatura" class="imagen-miniatura">
      </div>

      <ion-card-header>
        <ion-card-title>{{ cartaActual.nombre_espanol }}</ion-card-title>
        <ion-card-subtitle>{{ cartaActual.codigo }}</ion-card-subtitle>
      </ion-card-header>
      
      <ion-card-content>
        <div class="carta-info">
          <p><strong>Rareza:</strong> {{ cartaActual.rareza }}</p>
          <p><strong>Tipo:</strong> {{ cartaActual.tipo_carta }}</p>
          <p><strong>Expansión:</strong> {{ cartaActual.expansion }}</p>
        </div>
      </ion-card-content>
      
      <div class="botones-accion">
        <ion-button expand="block" class="boton-confirmar" (click)="confirmarCarta(cartaActual)">
          <ion-icon name="checkmark-outline" slot="start"></ion-icon>
          Imagen Correcta
        </ion-button>
        <ion-button expand="block" class="boton-editar" (click)="editarImagen(cartaActual)">
          <ion-icon name="create-outline" slot="start"></ion-icon>
          Cambiar Imagen
        </ion-button>
      </div>
    </ion-card>
  </div>
  
  <div *ngIf="cartaActualIndex >= cartas_pendientes.length" class="revision-completada">
    <h2>¡Revisión completada!</h2>
  </div>
</ion-content>
