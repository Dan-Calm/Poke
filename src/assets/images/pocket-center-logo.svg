<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <!-- Círculo exterior -->
  <circle cx="400" cy="400" r="350" fill="none" stroke="#1a2332" stroke-width="30"/>
  
  <!-- Silueta del Pokémon (Detective Pikachu) -->
  <g fill="#1a2332">
    <!-- Cuerpo principal -->
    <ellipse cx="400" cy="450" rx="120" ry="140"/>
    
    <!-- Cabeza -->
    <ellipse cx="400" cy="280" rx="100" ry="90"/>
    
    <!-- Orejas -->
    <ellipse cx="350" cy="220" rx="25" ry="60" transform="rotate(-30 350 220)"/>
    <ellipse cx="450" cy="220" rx="25" ry="60" transform="rotate(30 450 220)"/>
    
    <!-- Sombrero de detective -->
    <path d="M 320 200 Q 400 160 480 200 Q 490 180 480 160 Q 400 120 320 160 Q 310 180 320 200 Z"/>
    
    <!-- Cola -->
    <path d="M 480 480 Q 520 460 540 420 Q 560 400 550 380 Q 530 390 510 420 Q 490 450 480 480 Z"/>
    
    <!-- Lupa -->
    <circle cx="280" cy="350" r="40" fill="none" stroke="#1a2332" stroke-width="8"/>
    <line x1="240" y1="390" x2="220" y2="410" stroke="#1a2332" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Texto POCKET -->
  <text x="400" y="650" font-family="Arial Black, sans-serif" font-size="80" font-weight="900" fill="#FF5722" text-anchor="middle">POCKET</text>
  
  <!-- Texto CENTER -->
  <text x="400" y="730" font-family="Arial Black, sans-serif" font-size="80" font-weight="900" fill="#00BCD4" text-anchor="middle">CENTER</text>
</svg>
